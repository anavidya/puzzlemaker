<!DOCTYPE html>
<html>
<head>
    <title>GEBCO Ocean Puzzle</title>
    <link rel="stylesheet" href="/static/puzzle.css">
    <script src="https://flbulgarelli.github.io/headbreaker/js/headbreaker.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>
<body>
	<div class="main-wrapper">
    <div id="canvas"></div>

	<div id="ui" class="theme_discovery">
		<div id="thumbnail-gallery" class="gallery"></div>
		<div>
			<h2>Ocean Map Puzzle</h2>
			<p>Time: <span id="timer">0</span>s</p>
			<button class="submit-btn" onclick="location.reload()">Reset Puzzle</button>
		</div>
		<div id="leaderboard" class="theme_discovery">
			<div id="leaderboard-container">
				<h3>Fastest Explorers</h3>
				<div class="lb-header">
					<span>#</span>
					<span>Name</span>
					<span>Time</span>
				</div>
				<div id="score-list"></div>
			</div>
		</div>
	</div>
	
	

	<div id="win-modal" class="modal-overlay" style="display: none;">
		<div class="modal-content">
			<h2>🏆 You Did It!</h2>
			<p id="win-message"></p>
			<input type="text" id="player-name" placeholder="Enter your name">
			<button class="submit-btn" onclick="submitScore()">Submit Score</button>
		</div>
	</div>
</div>

    <script src="/static/puzzle.js"></script>
</body>
</html>
